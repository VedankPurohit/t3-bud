name: Check source installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install from source into a temporary directory
        run: pnpm companion install --no-launch --app-dir "$RUNNER_TEMP/companion-apps"
      - name: Check the packaged command interface
        run: node scripts/smoke-install.mjs "$RUNNER_TEMP/companion-apps"
      - name: Check the built checkout command interface
        run: node scripts/smoke-install.mjs --source
      - name: Check grouped notifications and dismissal races
        run: node scripts/smoke-notifications.mjs
      - name: Check native startup registration with a disposable app
        run: node scripts/smoke-startup.mjs
